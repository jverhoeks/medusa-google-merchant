name: Plugin checks
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: fixture_only
          POSTGRES_DB: merchant_plugin_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s
          --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm install --global npm@11.19.0
      - run: npm ci --no-audit --no-fund
      - run: npm test
      - run: npm run typecheck
      - run: npm pack
      - run: npm run pack:feed
      - name: Exercise packaged plugin in isolated Medusa
        run: node scripts/smoke-plugin.cjs
        env:
          MERCHANT_TEST_DATABASE_URL: postgres://postgres:fixture_only@localhost:5432/merchant_plugin_test?sslmode=disable
      - name: Verify package contents
        run: node scripts/check-package.cjs
      - uses: actions/upload-artifact@v4
        with:
          name: merchant-plugin-package
          path: "*.tgz"
          retention-days: 30
